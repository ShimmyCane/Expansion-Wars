<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fbf6e9">
  <title>Expansion Wars</title>
  <link rel="stylesheet" href="shared/hub.css">
  <link rel="stylesheet" href="shared/notes.css">
</head>
<body>
  <main class="hub">
    <div class="logo" aria-hidden="true">🍄</div>
    <h1>Expansion Wars</h1>
    <p class="tag">Send your soldiers. Take the whole meadow.</p>

    <nav class="scales" aria-label="Scales of play">
      <a class="scale" href="V4/index.html">
        <span class="scale-name">Unit scale</span>
        <span class="scale-what">Move units across a map and fight.</span>
      </a>
      <a class="scale" href="province/index.html">
        <span class="scale-name">Province scale</span>
        <span class="scale-what">Take spots on a province map, along the roads.</span>
      </a>
      <a class="scale" href="country/index.html">
        <span class="scale-name">Country scale</span>
        <span class="scale-what">Lead a nation: turns, diplomacy, and war across the meadow.</span>
      </a>
    </nav>

    <a class="archive" href="archive/index.html">📁 Archive</a>
  </main>

  <button id="gear" class="gear" aria-label="Settings" aria-expanded="false">⚙️</button>
  <section id="settings-panel" class="settings" hidden>
    <div class="settings-head"><strong>Settings</strong><button id="settings-close" type="button">Close</button></div>
  </section>

  <script src="shared/config.js"></script>
  <script src="shared/notes.js"></script>
  <script>
    (function () {
      var gear = document.getElementById('gear'), panel = document.getElementById('settings-panel');
      function open(on) { panel.hidden = !on; gear.setAttribute('aria-expanded', String(on)); }
      gear.addEventListener('click', function () { open(panel.hidden); });
      document.getElementById('settings-close').addEventListener('click', function () { open(false); });
      XWNotes.attach({ panel: panel, page: 'Home', context: function () { return 'Home: choose a scale'; } });
    })();
  </script>
</body>
</html>
